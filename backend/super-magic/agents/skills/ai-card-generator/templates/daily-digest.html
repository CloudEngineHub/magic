<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{CARD_TITLE}}</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --card-bg: #f8f9fa;
            --accent: #3b82f6;
            --border: #e5e7eb;
            --muted: #6b7280;
            --success: #10b981;
            --warning: #f59e0b;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --text: #e2e8f0;
                --card-bg: #1e293b;
                --accent: #60a5fa;
                --border: #334155;
                --muted: #94a3b8;
                --success: #34d399;
                --warning: #fbbf24;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            line-height: 1.6;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header .subtitle {
            font-size: 0.875rem;
            color: var(--muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .metric-change {
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .metric-change.positive {
            color: var(--success);
        }

        .metric-change.negative {
            color: var(--warning);
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .news-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .news-item {
            display: flex;
            gap: 12px;
            padding: 10px 12px;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .news-time {
            font-size: 0.75rem;
            color: var(--muted);
            white-space: nowrap;
            flex-shrink: 0;
            padding-top: 2px;
        }

        .news-content {
            font-size: 0.875rem;
            flex: 1;
        }

        .footer {
            margin-top: 24px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--muted);
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>{{CARD_TITLE}}</h1>
        <p class="subtitle">{{CARD_DESCRIPTION}} · {{GENERATED_AT}}</p>
    </div>

    <!-- DATA:metrics_START -->
    <div class="grid">
        <div class="metric-card">
            <div class="metric-label">关键指标 A</div>
            <div class="metric-value">12.5K</div>
            <div class="metric-change positive">↑ 8.2% vs 昨日</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">关键指标 B</div>
            <div class="metric-value">3,847</div>
            <div class="metric-change positive">↑ 12.1% vs 昨日</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">关键指标 C</div>
            <div class="metric-value">92.3%</div>
            <div class="metric-change negative">↓ 1.5% vs 昨日</div>
        </div>
    </div>
    <!-- DATA:metrics_END -->

    <!-- DATA:news_START -->
    <div class="section">
        <h2 class="section-title">📰 今日要闻</h2>
        <ul class="news-list">
            <li class="news-item">
                <span class="news-time">09:30</span>
                <span class="news-content">示例新闻条目 #1 — 这里是新闻摘要内容</span>
            </li>
            <li class="news-item">
                <span class="news-time">08:15</span>
                <span class="news-content">示例新闻条目 #2 — 这里是新闻摘要内容</span>
            </li>
            <li class="news-item">
                <span class="news-time">07:00</span>
                <span class="news-content">示例新闻条目 #3 — 这里是新闻摘要内容</span>
            </li>
        </ul>
    </div>
    <!-- DATA:news_END -->

    <div class="footer">
        Auto-generated · Update #{{UPDATE_COUNT}}
    </div>
</body>

</html>
