<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{CARD_TITLE}}</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --card-bg: #f8f9fa;
            --accent: #ef4444;
            --accent-light: #fef2f2;
            --border: #e5e7eb;
            --muted: #6b7280;
            --up: #22c55e;
            --down: #ef4444;
            --new: #f59e0b;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --text: #e2e8f0;
                --card-bg: #1e293b;
                --accent: #f87171;
                --accent-light: #1e1b2e;
                --border: #334155;
                --muted: #94a3b8;
                --up: #4ade80;
                --down: #f87171;
                --new: #fbbf24;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1::before {
            content: "🔥";
        }

        .header .time {
            font-size: 0.875rem;
            color: var(--muted);
        }

        .hotlist {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hotlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .hotlist-item:hover {
            transform: translateX(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .rank {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            background: var(--card-bg);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .rank-top {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .item-content {
            flex: 1;
            min-width: 0;
        }

        .item-title {
            font-size: 0.95rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-meta {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .trend {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            flex-shrink: 0;
        }

        .trend-up {
            color: var(--up);
            background: rgba(34, 197, 94, 0.1);
        }

        .trend-down {
            color: var(--down);
            background: rgba(239, 68, 68, 0.1);
        }

        .trend-new {
            color: var(--new);
            background: rgba(245, 158, 11, 0.1);
        }

        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--muted);
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>{{CARD_TITLE}}</h1>
        <span class="time">{{GENERATED_AT}}</span>
    </div>

    <!-- DATA_SECTION_START -->
    <ol class="hotlist">
        <li class="hotlist-item">
            <span class="rank rank-top">1</span>
            <div class="item-content">
                <div class="item-title">示例热点话题 #1</div>
                <div class="item-meta">热度 1,234,567</div>
            </div>
            <span class="trend trend-up">↑ 12</span>
        </li>
        <li class="hotlist-item">
            <span class="rank rank-top">2</span>
            <div class="item-content">
                <div class="item-title">示例热点话题 #2</div>
                <div class="item-meta">热度 987,654</div>
            </div>
            <span class="trend trend-new">NEW</span>
        </li>
        <li class="hotlist-item">
            <span class="rank rank-top">3</span>
            <div class="item-content">
                <div class="item-title">示例热点话题 #3</div>
                <div class="item-meta">热度 876,543</div>
            </div>
            <span class="trend trend-down">↓ 5</span>
        </li>
        <li class="hotlist-item">
            <span class="rank">4</span>
            <div class="item-content">
                <div class="item-title">示例热点话题 #4</div>
                <div class="item-meta">热度 765,432</div>
            </div>
            <span class="trend trend-up">↑ 3</span>
        </li>
        <li class="hotlist-item">
            <span class="rank">5</span>
            <div class="item-content">
                <div class="item-title">示例热点话题 #5</div>
                <div class="item-meta">热度 654,321</div>
            </div>
            <span class="trend trend-up">↑ 1</span>
        </li>
    </ol>
    <!-- DATA_SECTION_END -->

    <div class="footer">
        Auto-generated · Update #{{UPDATE_COUNT}}
    </div>
</body>

</html>
