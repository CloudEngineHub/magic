# NOTE: `enterprise/` is intentionally NOT a workspace member. It is a
# standalone install root with its own pnpm-workspace.yaml and pnpm-lock.yaml,
# so this (open-source) lockfile never references commercial dependencies.
packages:
  - "packages/magic-admin"
  - "packages/html2pptx"
  - "packages/html2image"
  - "packages/magic-widget-sdk"
  - "packages/html-sandbox"
  - "packages/x-markdown"

overrides:
  "@dtyq/magic-flow>react": 18.3.1
  "@dtyq/magic-flow>react-dom": 18.3.1
  "@types/react": 18.3.23
  "@types/react-dom": 18.3.7
  esbuild: 0.24.0
  katex: 0.16.21
  marked: 15.0.12

patchedDependencies:
  pptxgenjs: patches/pptxgenjs.patch
  tiptap-markdown: patches/tiptap-markdown.patch
